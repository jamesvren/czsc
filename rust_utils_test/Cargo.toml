[package]
name = "rust-utils-test"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
diesel = { version = "2.0", features = ["sqlite", "r2d2", "chrono"] }
log = "0.4"
env_logger = "0.10"
dirs = "5.0"
rand = "0.8"