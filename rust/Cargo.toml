[package]
name = "rs-czsc"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.7"
num-traits = "0.2"
num-derive = "0.3"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
pyo3 = { version = "0.20", features = ["extension-module"] }
dirs = "5.0"
rand = "0.8"

[dev-dependencies]